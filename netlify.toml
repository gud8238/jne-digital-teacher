[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
